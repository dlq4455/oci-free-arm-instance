name: Try to Create OCI VM

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: write

env:
  COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
  IMAGE_ID: ${{ secrets.IMAGE_ID }}
  SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
  OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
  OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
  OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
  OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
  OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
  AD_NAMES: ${{ secrets.AD_NAMES }}

jobs:
  create-vm:
    runs-on: ubuntu-latest
    steps:
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.local
          key: ${{ runner.os }}-pip-oci-cli-v1

      - name: Add OCI CLI to path
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Setup OCI CLI and try to create VM
        id: create_vm
        run: |
          set -o pipefail
          pip install oci-cli

          mkdir -p ~/.oci
          echo "${{ secrets.OCI_CLI_KEY_CONTENT }}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem

          {
            echo "[DEFAULT]"
            echo "user=${{ secrets.OCI_CLI_USER }}"
            echo "tenancy=${{ secrets.OCI_CLI_TENANCY }}"
            echo "fingerprint=${{ secrets.OCI_CLI_FINGERPRINT }}"
            echo "key_file=~/.oci/oci_api_key.pem"
            echo "region=${{ secrets.OCI_CLI_REGION }}"
          } > ~/.oci/config

          echo "${{ secrets.SSH_PUBLIC_KEY }}" > /home/runner/my_ssh_key.pub

          cat > /home/runner/cloud-init.yaml <<'EOF'
          #cloud-config
          package_update: true
          runcmd:
            - curl -fsSL https://gitlab.com/spiritysdx/Oracle-server-keep-alive-script/-/raw/main/oalive.sh -o /root/oalive.sh
            - chmod +x /root/oalive.sh
            - printf '1\nn\n1\ny\ny\n2\nn\n' | bash /root/oalive.sh
          EOF

          all_output=""
          success="false"
          IFS=', ' read -r -a availability_domains <<< "$AD_NAMES"

          for ad_name in "${availability_domains[@]}"; do
            [ -z "$ad_name" ] && continue
            echo "Trying availability domain: $ad_name"

            oci_output=$(oci compute instance launch \
              --compartment-id "$COMPARTMENT_ID" \
              --availability-domain "$ad_name" \
              --shape "VM.Standard.A1.Flex" \
              --shape-config '{"ocpus":2,"memoryInGBs":12}' \
              --subnet-id "$SUBNET_ID" \
              --image-id "$IMAGE_ID" \
              --ssh-authorized-keys-file "/home/runner/my_ssh_key.pub" \
              --user-data-file "/home/runner/cloud-init.yaml" \
              --assign-public-ip true \
              --display-name "oracle-a1-free-2c12g" \
              --boot-volume-size-in-gbs 50 2>&1 || true)

            printf -v all_output '%s\n===== %s =====\n%s\n' "$all_output" "$ad_name" "$oci_output"
            echo "$oci_output"

            if echo "$oci_output" | grep -q '"lifecycle-state": "PROVISIONING"'; then
              success="true"
              break
            fi
          done

          {
            echo "log_data<<EOF"
            echo "$all_output"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          if [ "$success" = "true" ]; then
            echo "Success: instance is provisioning."
            exit 0
          fi

          echo "No capacity or another error prevented VM creation."
          exit 1

      - name: Notify success with GitHub issue
        if: steps.create_vm.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --assignee "${{ github.repository_owner }}" \
            --title "OCI A1 VM created: oracle-a1-free-2c12g" \
            --body "Oracle A1 VM creation succeeded. Instance is provisioning.

          Shape: VM.Standard.A1.Flex
          OCPU/RAM: 2 OCPU / 12 GB
          Boot volume: 50 GB
          Region: us-phoenix-1
          SSH private key on your PC: F:\\dev\\test\\oracle_key
          Workflow run: ${RUN_URL}"

      - name: Send success email
        if: steps.create_vm.outcome == 'success'
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "OCI A1 VM created: oracle-a1-free-2c12g"
          to: dlq4455@gmail.com
          from: OCI A1 Notifier <${{ secrets.MAIL_USERNAME }}>
          body: |
            Oracle A1 VM creation succeeded.

            Shape: VM.Standard.A1.Flex
            OCPU/RAM: 2 OCPU / 12 GB
            Boot volume: 50 GB
            Region: us-phoenix-1
            SSH private key on your PC: F:\dev\test\oracle_key
            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Disable workflow after success
        if: always() && steps.create_vm.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow disable create-vm.yml --repo "${{ github.repository }}"
