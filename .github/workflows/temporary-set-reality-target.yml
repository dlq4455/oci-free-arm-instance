name: Temporary Set Reality Target

on:
  workflow_dispatch:
    inputs:
      target:
        required: true
        type: string
        default: www.cloudflare.com
      public_ip:
        required: true
        type: string
        default: 129.146.94.18

permissions:
  contents: read

env:
  ORACLE_SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}

jobs:
  set-target:
    runs-on: ubuntu-latest
    steps:
      - name: Set Reality target
        run: |
          set -Eeuo pipefail
          target='${{ inputs.target }}'
          public_ip='${{ inputs.public_ip }}'

          test -n "$ORACLE_SSH_PRIVATE_KEY"
          printf '%s\n' "$ORACLE_SSH_PRIVATE_KEY" > /tmp/oracle_ssh_key
          chmod 600 /tmp/oracle_ssh_key

          ssh -i /tmp/oracle_ssh_key \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 \
            "ubuntu@${public_ip}" \
            "sudo TARGET='$target' python3 -" <<'PY'
          import json, os, subprocess

          path = "/usr/local/etc/xray/config.json"
          target = os.environ["TARGET"]

          with open(path, encoding="utf-8") as f:
              config = json.load(f)

          inbound = next(i for i in config["inbounds"] if i.get("port") == 443 and i.get("protocol") == "vless")
          reality = inbound["streamSettings"]["realitySettings"]
          reality["dest"] = f"{target}:443"
          reality["serverNames"] = [target]

          with open(path, "w", encoding="utf-8") as f:
              json.dump(config, f, indent=2)

          subprocess.check_call(["/usr/local/bin/xray", "run", "-test", "-config", path])
          subprocess.check_call(["systemctl", "restart", "xray"])
          print("TARGET=" + target)
          print("XRAY_STATUS=" + subprocess.check_output(["systemctl", "is-active", "xray"], text=True).strip())
          PY
