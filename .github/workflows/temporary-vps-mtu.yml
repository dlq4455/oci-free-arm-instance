name: Temporary VPS MTU

on:
  workflow_dispatch:
    inputs:
      public_ip:
        required: true
        type: string
        default: 129.146.94.18
      mtu:
        required: true
        type: string
        default: "1500"

permissions:
  contents: read

env:
  ORACLE_SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}

jobs:
  set-mtu:
    runs-on: ubuntu-latest
    steps:
      - name: Set live default-interface MTU
        run: |
          set -Eeuo pipefail
          public_ip='${{ inputs.public_ip }}'
          mtu='${{ inputs.mtu }}'

          test -n "$ORACLE_SSH_PRIVATE_KEY"
          printf '%s\n' "$ORACLE_SSH_PRIVATE_KEY" > /tmp/oracle_ssh_key
          chmod 600 /tmp/oracle_ssh_key

          ssh -i /tmp/oracle_ssh_key \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 \
            "ubuntu@${public_ip}" \
            "sudo TARGET_MTU='${mtu}' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          dev=$(ip route get 1.1.1.1 | awk '{for (i=1; i<=NF; i++) if ($i == "dev") {print $(i+1); exit}}')
          test -n "$dev"
          echo "DEV=$dev"
          echo "BEFORE=$(ip -o link show dev "$dev")"
          ip link set dev "$dev" mtu "$TARGET_MTU"
          echo "AFTER=$(ip -o link show dev "$dev")"
          echo "XRAY_STATUS=$(systemctl is-active xray)"
          echo "CPU_KEEPALIVE=$(systemctl is-active cpu-limit.service)"
          echo "MEM_KEEPALIVE=$(systemctl is-active memory-limit.service)"
          REMOTE
