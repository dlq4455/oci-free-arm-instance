name: Temporary Set TCP CC

on:
  workflow_dispatch:
    inputs:
      cc:
        required: true
        type: choice
        options: [bbr, cubic]
        default: bbr
      public_ip:
        required: true
        type: string
        default: 129.146.94.18

permissions:
  contents: read

env:
  ORACLE_SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}

jobs:
  set-cc:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set -Eeuo pipefail
          cc='${{ inputs.cc }}'
          public_ip='${{ inputs.public_ip }}'
          test -n "$ORACLE_SSH_PRIVATE_KEY"
          printf '%s\n' "$ORACLE_SSH_PRIVATE_KEY" > /tmp/oracle_ssh_key
          chmod 600 /tmp/oracle_ssh_key
          ssh -i /tmp/oracle_ssh_key \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 \
            "ubuntu@${public_ip}" \
            "sudo sysctl -w net.ipv4.tcp_congestion_control='$cc' net.core.default_qdisc=fq && sysctl -n net.ipv4.tcp_congestion_control net.core.default_qdisc"
