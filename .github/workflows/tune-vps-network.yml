name: Tune VPS Network

on:
  workflow_dispatch:
    inputs:
      public_ip:
        required: true
        type: string
        default: 129.146.94.18

permissions:
  contents: read

env:
  ORACLE_SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}

jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - name: Enable BBR
        run: |
          set -Eeuo pipefail
          public_ip='${{ inputs.public_ip }}'

          test -n "$ORACLE_SSH_PRIVATE_KEY"
          printf '%s\n' "$ORACLE_SSH_PRIVATE_KEY" > /tmp/oracle_ssh_key
          chmod 600 /tmp/oracle_ssh_key

          ssh -i /tmp/oracle_ssh_key \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 \
            "ubuntu@${public_ip}" \
            'sudo bash -s' <<'REMOTE'
          set -Eeuo pipefail
          cat > /etc/sysctl.d/99-xray-bbr.conf <<'EOF'
          net.core.default_qdisc=fq
          net.core.rmem_max=67108864
          net.core.wmem_max=67108864
          net.ipv4.tcp_congestion_control=bbr
          net.ipv4.tcp_fastopen=3
          net.ipv4.tcp_mtu_probing=1
          net.ipv4.tcp_rmem=4096 87380 67108864
          net.ipv4.tcp_slow_start_after_idle=0
          net.ipv4.tcp_wmem=4096 65536 67108864
          EOF
          sysctl --system >/dev/null
          echo "AVAILABLE_CC=$(sysctl -n net.ipv4.tcp_available_congestion_control)"
          echo "TCP_CONGESTION=$(sysctl -n net.ipv4.tcp_congestion_control)"
          echo "DEFAULT_QDISC=$(sysctl -n net.core.default_qdisc)"
          echo "RMEM_MAX=$(sysctl -n net.core.rmem_max)"
          echo "WMEM_MAX=$(sysctl -n net.core.wmem_max)"
          echo "TCP_FASTOPEN=$(sysctl -n net.ipv4.tcp_fastopen)"
          echo "TCP_MTU_PROBING=$(sysctl -n net.ipv4.tcp_mtu_probing)"
          echo "TCP_RMEM=$(sysctl -n net.ipv4.tcp_rmem)"
          echo "TCP_WMEM=$(sysctl -n net.ipv4.tcp_wmem)"
          echo "SLOW_START_IDLE=$(sysctl -n net.ipv4.tcp_slow_start_after_idle)"
          echo "XRAY_STATUS=$(systemctl is-active xray)"
          echo "CPU_KEEPALIVE=$(systemctl is-active cpu-limit.service)"
          echo "MEM_KEEPALIVE=$(systemctl is-active memory-limit.service)"
          REMOTE
