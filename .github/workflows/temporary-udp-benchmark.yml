name: Temporary UDP Benchmark

on:
  workflow_dispatch:
    inputs:
      mode:
        required: true
        type: choice
        default: start
        options:
          - start
          - cleanup
      public_ip:
        required: true
        type: string
        default: 129.146.94.18
      instance_id:
        required: true
        type: string
        default: ocid1.instance.oc1.phx.anyhqljrfzrpzuac55352eu2uc2morwejfheau3glc5xusvxdz5d5itrggfa
      port:
        required: true
        type: string
        default: "55201"

permissions:
  contents: read

env:
  COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
  OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
  OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
  OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
  OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
  OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
  ORACLE_SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}

jobs:
  udp-benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Add OCI CLI to path
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install OCI CLI
        run: |
          command -v oci >/dev/null 2>&1 || python -m pip install --user oci-cli
          oci --version

      - name: Configure OCI network rule
        run: |
          set -Eeuo pipefail
          export SUPPRESS_LABEL_WARNING=True
          mode='${{ inputs.mode }}'
          port='${{ inputs.port }}'
          source_cidr='0.0.0.0/0'
          description="temporary-codex-udp-benchmark-${port}"

          mkdir -p ~/.oci
          printf '%s\n' "$OCI_CLI_KEY_CONTENT" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem
          {
            echo "[DEFAULT]"
            echo "user=$OCI_CLI_USER"
            echo "tenancy=$OCI_CLI_TENANCY"
            echo "fingerprint=$OCI_CLI_FINGERPRINT"
            echo "key_file=~/.oci/oci_api_key.pem"
            echo "region=$OCI_CLI_REGION"
          } > ~/.oci/config

          instance_id='${{ inputs.instance_id }}'

          vnic_id=$(oci --no-retry compute vnic-attachment list \
            --compartment-id "$COMPARTMENT_ID" \
            --instance-id "$instance_id" \
            --query 'data[0]."vnic-id"' \
            --raw-output)
          subnet_id=$(oci --no-retry network vnic get \
            --vnic-id "$vnic_id" \
            --query 'data."subnet-id"' \
            --raw-output)
          security_list_id=$(oci --no-retry network subnet get \
            --subnet-id "$subnet_id" \
            --query 'data."security-list-ids"[0]' \
            --raw-output)
          oci --no-retry network security-list get \
            --security-list-id "$security_list_id" \
            > /tmp/security-list.json

          jq --arg desc "$description" --arg port "$port" '
            .data."ingress-security-rules"
            | map(select(.description != $desc))
            | map(select((.protocol == "17"
              and ((.udpOptions.destinationPortRange.min // ."udp-options"."destination-port-range".min // 0) == ($port | tonumber))
              and ((.udpOptions.destinationPortRange.max // ."udp-options"."destination-port-range".max // 0) == ($port | tonumber))
            ) | not))
          ' /tmp/security-list.json > /tmp/ingress.json

          if [ "$mode" = "start" ]; then
            jq --arg desc "$description" --arg source "$source_cidr" --argjson port "$port" '. + [{
              "description": $desc,
              "protocol": "17",
              "source": $source,
              "source-type": "CIDR_BLOCK",
              "udp-options": {
                "destination-port-range": {
                  "min": $port,
                  "max": $port
                }
              }
            }]' /tmp/ingress.json > /tmp/ingress-new.json
            mv /tmp/ingress-new.json /tmp/ingress.json
          fi

          jq '.data."egress-security-rules"' /tmp/security-list.json > /tmp/egress.json
          oci --no-retry network security-list update \
            --security-list-id "$security_list_id" \
            --ingress-security-rules file:///tmp/ingress.json \
            --egress-security-rules file:///tmp/egress.json \
            --force >/dev/null
          echo "OCI_UDP_RULE_MODE=$mode"
          echo "OCI_UDP_PORT=$port"

      - name: Start or cleanup UDP service
        run: |
          set -Eeuo pipefail
          mode='${{ inputs.mode }}'
          port='${{ inputs.port }}'
          public_ip='${{ inputs.public_ip }}'

          test -n "$ORACLE_SSH_PRIVATE_KEY"
          printf '%s\n' "$ORACLE_SSH_PRIVATE_KEY" > /tmp/oracle_ssh_key
          chmod 600 /tmp/oracle_ssh_key

          ssh -i /tmp/oracle_ssh_key \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 \
            "ubuntu@${public_ip}" \
            "sudo MODE='${mode}' UDP_PORT='${port}' bash -s" <<'REMOTE'
          set -Eeuo pipefail

          if [ "$MODE" = "cleanup" ]; then
            systemctl stop udp-benchmark.service 2>/dev/null || true
            rm -f /etc/systemd/system/udp-benchmark.service /usr/local/bin/udp-benchmark.py
            systemctl daemon-reload
            iptables -D INPUT -p udp --dport "$UDP_PORT" -j ACCEPT 2>/dev/null || true
            echo "UDP_BENCHMARK=cleanup"
            echo "XRAY_STATUS=$(systemctl is-active xray)"
            echo "CPU_KEEPALIVE=$(systemctl is-active cpu-limit.service)"
            echo "MEM_KEEPALIVE=$(systemctl is-active memory-limit.service)"
            exit 0
          fi

          cat > /usr/local/bin/udp-benchmark.py <<'PY'
          #!/usr/bin/env python3
          import os
          import socket
          import struct
          import time

          port = int(os.environ["UDP_PORT"])
          sock = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
          sock.bind(("0.0.0.0", port))
          sock.settimeout(1.0)
          uploads = {}

          def parse_cmd(data):
              try:
                  return data.decode("ascii", "strict").strip().split()
              except UnicodeDecodeError:
                  return []

          def send_down(addr, seconds, mbps, size):
              rate = mbps * 1000 * 1000 / 8
              size = max(32, size)
              payload = b"x" * (size - 8)
              started = time.monotonic()
              sent = 0
              seq = 0
              while time.monotonic() - started < seconds:
                  sock.sendto(struct.pack("!Q", seq) + payload, addr)
                  sent += size
                  seq += 1
                  target = started + sent / rate
                  delay = target - time.monotonic()
                  if delay > 0:
                      time.sleep(min(delay, 0.01))
              done = f"END {seq} {sent} {time.monotonic() - started:.3f}".encode()
              for _ in range(5):
                  sock.sendto(done, addr)

          while True:
              try:
                  data, addr = sock.recvfrom(65535)
              except socket.timeout:
                  continue
              parts = parse_cmd(data)
              now = time.monotonic()
              if parts and parts[0] == "DOWN" and len(parts) == 4:
                  send_down(addr, float(parts[1]), float(parts[2]), int(parts[3]))
              elif parts and parts[0] == "UP" and len(parts) == 4:
                  uploads[addr] = {"started": now, "bytes": 0, "packets": 0}
                  sock.sendto(b"READY", addr)
              elif parts and parts[0] == "DONE":
                  stat = uploads.pop(addr, {"started": now, "bytes": 0, "packets": 0})
                  elapsed = max(now - stat["started"], 0.001)
                  result = f"UP_RESULT {stat['packets']} {stat['bytes']} {elapsed:.3f}".encode()
                  for _ in range(5):
                      sock.sendto(result, addr)
              elif addr in uploads:
                  uploads[addr]["bytes"] += len(data)
                  uploads[addr]["packets"] += 1
          PY
          chmod 755 /usr/local/bin/udp-benchmark.py

          cat > /etc/systemd/system/udp-benchmark.service <<'EOF'
          [Unit]
          Description=Temporary UDP benchmark server
          After=network.target

          [Service]
          Environment=UDP_PORT=__UDP_PORT__
          ExecStart=/usr/bin/python3 /usr/local/bin/udp-benchmark.py
          RuntimeMaxSec=1800
          Restart=no
          EOF
          sed -i "s/__UDP_PORT__/$UDP_PORT/g" /etc/systemd/system/udp-benchmark.service
          systemctl daemon-reload
          iptables -C INPUT -p udp --dport "$UDP_PORT" -j ACCEPT 2>/dev/null || iptables -I INPUT 1 -p udp --dport "$UDP_PORT" -j ACCEPT
          systemctl restart udp-benchmark.service
          sleep 1
          systemctl is-active --quiet udp-benchmark.service
          echo "UDP_BENCHMARK=active"
          echo "UDP_PORT=$UDP_PORT"
          echo "XRAY_STATUS=$(systemctl is-active xray)"
          echo "CPU_KEEPALIVE=$(systemctl is-active cpu-limit.service)"
          echo "MEM_KEEPALIVE=$(systemctl is-active memory-limit.service)"
          REMOTE
