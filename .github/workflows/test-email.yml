name: Test Email Notification

on:
  workflow_dispatch:

jobs:
  send-test-email:
    runs-on: ubuntu-latest
    steps:
      - name: Send test email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Test email from OCI A1 GitHub Actions"
          to: dlq4455@gmail.com
          from: OCI A1 Notifier <${{ secrets.MAIL_USERNAME }}>
          body: |
            This is a test email from the OCI A1 GitHub Actions notifier.

            If you received this, email notification is working.
