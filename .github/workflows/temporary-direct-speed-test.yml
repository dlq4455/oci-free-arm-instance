name: Temporary Direct Speed Test

on:
  workflow_dispatch:
    inputs:
      action:
        required: true
        type: choice
        options: [start, stop]
        default: start
      public_ip:
        required: true
        type: string
        default: 129.146.94.18
      instance_id:
        required: true
        type: string
        default: ocid1.instance.oc1.phx.anyhqljrfzrpzuac55352eu2uc2morwejfheau3glc5xusvxdz5d5itrggfa
      port:
        required: true
        type: string
        default: "18080"
      file_mb:
        required: true
        type: string
        default: "256"

permissions:
  contents: read

env:
  COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
  OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
  OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
  OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
  OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
  OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
  ORACLE_SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}

jobs:
  speed-test:
    runs-on: ubuntu-latest
    steps:
      - name: Restore OCI CLI cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.local
          key: ${{ runner.os }}-pip-oci-cli-v2

      - name: Add OCI CLI to path
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install OCI CLI
        run: |
          command -v oci >/dev/null 2>&1 || python -m pip install --user oci-cli
          oci --version

      - name: Start or stop direct speed server
        run: |
          set -Eeuo pipefail
          export SUPPRESS_LABEL_WARNING=True

          action='${{ inputs.action }}'
          public_ip='${{ inputs.public_ip }}'
          instance_id='${{ inputs.instance_id }}'
          port='${{ inputs.port }}'
          file_mb='${{ inputs.file_mb }}'

          case "$port" in ''|*[!0-9]*) echo "invalid port=$port" >&2; exit 1 ;; esac
          case "$file_mb" in ''|*[!0-9]*) echo "invalid file_mb=$file_mb" >&2; exit 1 ;; esac

          mkdir -p ~/.oci
          printf '%s\n' "$OCI_CLI_KEY_CONTENT" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem
          {
            echo "[DEFAULT]"
            echo "user=$OCI_CLI_USER"
            echo "tenancy=$OCI_CLI_TENANCY"
            echo "fingerprint=$OCI_CLI_FINGERPRINT"
            echo "key_file=~/.oci/oci_api_key.pem"
            echo "region=$OCI_CLI_REGION"
          } > ~/.oci/config

          vnic_id=$(oci --no-retry compute vnic-attachment list \
            --compartment-id "$COMPARTMENT_ID" \
            --instance-id "$instance_id" \
            --query 'data[0]."vnic-id"' \
            --raw-output)
          subnet_id=$(oci --no-retry network vnic get \
            --vnic-id "$vnic_id" \
            --query 'data."subnet-id"' \
            --raw-output)
          security_list_id=$(oci --no-retry network subnet get \
            --subnet-id "$subnet_id" \
            --query 'data."security-list-ids"[0]' \
            --raw-output)
          oci --no-retry network security-list get \
            --security-list-id "$security_list_id" \
            > /tmp/security-list.json

          if [ "$action" = start ]; then
            jq --argjson p "$port" '
              if any(.data."ingress-security-rules"[]?;
                .protocol == "6"
                and .source == "0.0.0.0/0"
                and ((.tcpOptions.destinationPortRange.min // ."tcp-options"."destination-port-range".min // 0) == $p)
                and ((.tcpOptions.destinationPortRange.max // ."tcp-options"."destination-port-range".max // 0) == $p)
              ) then .data."ingress-security-rules"
              else .data."ingress-security-rules" + [{
                "protocol": "6",
                "source": "0.0.0.0/0",
                "source-type": "CIDR_BLOCK",
                "tcp-options": {"destination-port-range": {"min": $p, "max": $p}}
              }] end
            ' /tmp/security-list.json > /tmp/ingress.json
          else
            jq --argjson p "$port" '[.data."ingress-security-rules"[]? | select(
              .protocol != "6"
              or ((.tcpOptions.destinationPortRange.min // ."tcp-options"."destination-port-range".min // 0) != $p)
              or ((.tcpOptions.destinationPortRange.max // ."tcp-options"."destination-port-range".max // 0) != $p)
            )]' /tmp/security-list.json > /tmp/ingress.json
          fi
          jq '.data."egress-security-rules"' /tmp/security-list.json > /tmp/egress.json
          oci --no-retry network security-list update \
            --security-list-id "$security_list_id" \
            --ingress-security-rules file:///tmp/ingress.json \
            --egress-security-rules file:///tmp/egress.json \
            --force >/dev/null

          test -n "$ORACLE_SSH_PRIVATE_KEY"
          printf '%s\n' "$ORACLE_SSH_PRIVATE_KEY" > /tmp/oracle_ssh_key
          chmod 600 /tmp/oracle_ssh_key

          ssh -i /tmp/oracle_ssh_key \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 \
            "ubuntu@${public_ip}" \
            "sudo ACTION='$action' PORT='$port' FILE_MB='$file_mb' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          dir=/tmp/oracle-direct-speed
          pidfile="$dir/http.pid"

          stop_server() {
            if [ -f "$pidfile" ]; then
              kill "$(cat "$pidfile")" 2>/dev/null || true
              rm -f "$pidfile"
            fi
            while iptables -C INPUT -p tcp --dport "$PORT" -j ACCEPT 2>/dev/null; do
              iptables -D INPUT -p tcp --dport "$PORT" -j ACCEPT || true
            done
          }

          stop_server
          if [ "$ACTION" = start ]; then
            mkdir -p "$dir"
            dd if=/dev/zero of="$dir/test.bin" bs=1M count="$FILE_MB" status=none
            iptables -I INPUT 1 -p tcp --dport "$PORT" -j ACCEPT
            nohup python3 -m http.server "$PORT" --bind 0.0.0.0 --directory "$dir" >"$dir/http.log" 2>&1 &
            echo $! > "$pidfile"
            sleep 1
            ss -ltn sport = :"$PORT"
            echo "URL=http://0.0.0.0:$PORT/test.bin"
          else
            rm -rf "$dir"
            echo "STOPPED=1"
          fi
          REMOTE

      - name: Verify public port
        if: inputs.action == 'start'
        run: |
          set -Eeuo pipefail
          public_ip='${{ inputs.public_ip }}'
          port='${{ inputs.port }}'
          for _ in $(seq 1 12); do
            if timeout 5 bash -c ":</dev/tcp/${public_ip}/${port}"; then
              echo "PUBLIC_PORT=reachable"
              exit 0
            fi
            sleep 5
          done
          echo "PUBLIC_PORT=unreachable"
          exit 1
