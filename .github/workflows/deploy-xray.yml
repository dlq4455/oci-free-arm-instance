name: Deploy Xray Reality

on:
  workflow_dispatch:
    inputs:
      mode:
        required: true
        type: choice
        default: xray
        options:
          - xray
          - wofo-dr
          - wofo-assets
      instance_id:
        required: true
        type: string
        default: ocid1.instance.oc1.phx.anyhqljrfzrpzuac55352eu2uc2morwejfheau3glc5xusvxdz5d5itrggfa
      public_ip:
        required: true
        type: string
        default: 129.146.94.18

permissions:
  contents: read

env:
  COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
  OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
  OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
  OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
  OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
  OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
  ORACLE_SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}

jobs:
  deploy:
    if: inputs.mode == 'xray'
    runs-on: ubuntu-latest
    steps:
      - name: Restore OCI CLI cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.local
          key: ${{ runner.os }}-pip-oci-cli-v2

      - name: Add OCI CLI to path
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install OCI CLI
        run: |
          command -v oci >/dev/null 2>&1 || python -m pip install --user oci-cli
          oci --version

      - name: Deploy Xray through SSH
        run: |
          set -Eeuo pipefail
          export SUPPRESS_LABEL_WARNING=True

          mkdir -p ~/.oci
          printf '%s\n' "$OCI_CLI_KEY_CONTENT" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem
          {
            echo "[DEFAULT]"
            echo "user=$OCI_CLI_USER"
            echo "tenancy=$OCI_CLI_TENANCY"
            echo "fingerprint=$OCI_CLI_FINGERPRINT"
            echo "key_file=~/.oci/oci_api_key.pem"
            echo "region=$OCI_CLI_REGION"
          } > ~/.oci/config

          instance_id='${{ inputs.instance_id }}'
          public_ip='${{ inputs.public_ip }}'

          instance_state=$(oci --no-retry compute instance get \
            --instance-id "$instance_id" \
            --query 'data."lifecycle-state"' \
            --raw-output)
          test "$instance_state" = RUNNING

          vnic_id=$(oci --no-retry compute vnic-attachment list \
            --compartment-id "$COMPARTMENT_ID" \
            --instance-id "$instance_id" \
            --query 'data[0]."vnic-id"' \
            --raw-output)
          oci --no-retry network vnic get --vnic-id "$vnic_id" > /tmp/vnic.json
          subnet_id=$(jq -r '.data."subnet-id"' /tmp/vnic.json)
          echo "NSG_IDS=$(jq -r '.data."nsg-ids" // [] | join(",")' /tmp/vnic.json)"
          security_list_id=$(oci --no-retry network subnet get \
            --subnet-id "$subnet_id" \
            --query 'data."security-list-ids"[0]' \
            --raw-output)

          oci --no-retry network security-list get \
            --security-list-id "$security_list_id" \
            > /tmp/security-list.json

          has_443=$(jq -r '
            any(.data."ingress-security-rules"[]?;
              .protocol == "6"
              and .source == "0.0.0.0/0"
              and ((.tcpOptions.destinationPortRange.min // ."tcp-options"."destination-port-range".min // 0) == 443)
              and ((.tcpOptions.destinationPortRange.max // ."tcp-options"."destination-port-range".max // 0) == 443)
            )
          ' /tmp/security-list.json)

          if [ "$has_443" != "true" ]; then
            jq '.data."ingress-security-rules" + [{
              "protocol": "6",
              "source": "0.0.0.0/0",
              "source-type": "CIDR_BLOCK",
              "tcp-options": {
                "destination-port-range": {
                  "min": 443,
                  "max": 443
                }
              }
            }]' /tmp/security-list.json > /tmp/ingress.json
            jq '.data."egress-security-rules"' /tmp/security-list.json > /tmp/egress.json
            oci --no-retry network security-list update \
              --security-list-id "$security_list_id" \
              --ingress-security-rules file:///tmp/ingress.json \
              --egress-security-rules file:///tmp/egress.json \
              --force >/dev/null
          fi

          test -n "$ORACLE_SSH_PRIVATE_KEY"
          printf '%s\n' "$ORACLE_SSH_PRIVATE_KEY" > /tmp/oracle_ssh_key
          chmod 600 /tmp/oracle_ssh_key

          cat > /tmp/install-xray.sh <<'REMOTE'
          #!/usr/bin/env bash
          set -Eeuo pipefail

          PUBLIC_IP="__PUBLIC_IP__"
          REALITY_SERVER_NAME=www.cloudflare.com
          XRAY_DIR=/usr/local/etc/xray
          XRAY_SHARE_DIR=/usr/local/share/xray

          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y ca-certificates curl unzip jq openssl

          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT

          arch=$(uname -m)
          case "$arch" in
            aarch64|arm64) asset='Xray-linux-arm64-v8a.zip' ;;
            x86_64|amd64) asset='Xray-linux-64.zip' ;;
            *) echo "unsupported arch: $arch" >&2; exit 1 ;;
          esac

          release_json=$(curl -fsSL https://api.github.com/repos/XTLS/Xray-core/releases/latest)
          asset_url=$(printf '%s' "$release_json" | jq -r --arg asset "$asset" '.assets[] | select(.name == $asset) | .browser_download_url' | head -n 1)
          test -n "$asset_url"

          curl -fL "$asset_url" -o "$tmp/xray.zip"
          unzip -q "$tmp/xray.zip" -d "$tmp/xray"
          install -m 755 "$tmp/xray/xray" /usr/local/bin/xray
          mkdir -p "$XRAY_DIR" "$XRAY_SHARE_DIR"
          [ -f "$tmp/xray/geoip.dat" ] && install -m 644 "$tmp/xray/geoip.dat" "$XRAY_SHARE_DIR/geoip.dat"
          [ -f "$tmp/xray/geosite.dat" ] && install -m 644 "$tmp/xray/geosite.dat" "$XRAY_SHARE_DIR/geosite.dat"

          uuid=$(cat /proc/sys/kernel/random/uuid)
          keys=$(/usr/local/bin/xray x25519 2>&1)
          private_key=$(printf '%s\n' "$keys" | awk -F':[[:space:]]*' '$1 == "Private key" || $1 == "PrivateKey" {print $2; exit}')
          public_key=$(printf '%s\n' "$keys" | awk -F':[[:space:]]*' '$1 == "Public key" || $1 ~ /PublicKey/ || $1 == "Password" {print $2; exit}')
          if [ -z "$private_key" ] || [ -z "$public_key" ]; then
            printf '%s\n' "$keys" | sed -E 's/(:[[:space:]]*).+$/:\t<redacted>/'
            exit 1
          fi
          short_id=$(openssl rand -hex 8)

          cat > "$XRAY_DIR/config.json" <<EOF
          {
            "log": {
              "loglevel": "warning"
            },
            "inbounds": [
              {
                "listen": "0.0.0.0",
                "port": 443,
                "protocol": "vless",
                "settings": {
                  "clients": [
                    {
                      "id": "$uuid",
                      "flow": "xtls-rprx-vision"
                    }
                  ],
                  "decryption": "none"
                },
                "streamSettings": {
                  "network": "tcp",
                  "security": "reality",
                  "realitySettings": {
                    "show": false,
                    "dest": "${REALITY_SERVER_NAME}:443",
                    "xver": 0,
                    "serverNames": [
                      "$REALITY_SERVER_NAME"
                    ],
                    "privateKey": "$private_key",
                    "shortIds": [
                      "$short_id"
                    ],
                    "spiderX": "/"
                  }
                }
              }
            ],
            "outbounds": [
              {
                "protocol": "freedom",
                "tag": "direct"
              }
            ]
          }
          EOF
          chmod 755 "$XRAY_DIR"
          chmod 644 "$XRAY_DIR/config.json"

          cat > /etc/systemd/system/xray-iptables.service <<'EOF'
          [Unit]
          Description=Allow inbound Xray TCP 443
          Before=xray.service
          After=network.target

          [Service]
          Type=oneshot
          ExecStart=/bin/sh -c '/usr/sbin/iptables -C INPUT -p tcp --dport 443 -j ACCEPT 2>/dev/null || /usr/sbin/iptables -I INPUT 1 -p tcp --dport 443 -j ACCEPT'
          RemainAfterExit=yes

          [Install]
          WantedBy=multi-user.target
          EOF

          cat > /etc/systemd/system/xray.service <<'EOF'
          [Unit]
          Description=Xray Service
          After=network.target nss-lookup.target xray-iptables.service
          Requires=xray-iptables.service

          [Service]
          User=nobody
          CapabilityBoundingSet=CAP_NET_ADMIN CAP_NET_BIND_SERVICE
          AmbientCapabilities=CAP_NET_ADMIN CAP_NET_BIND_SERVICE
          NoNewPrivileges=true
          ExecStart=/usr/local/bin/xray run -config /usr/local/etc/xray/config.json
          Restart=on-failure
          RestartSec=5s

          [Install]
          WantedBy=multi-user.target
          EOF

          /usr/local/bin/xray run -test -config "$XRAY_DIR/config.json"
          systemctl daemon-reload
          systemctl enable --now xray-iptables.service
          systemctl enable xray
          systemctl restart xray
          sleep 2
          systemctl is-active --quiet xray

          link="vless://${uuid}@${PUBLIC_IP}:443?encryption=none&security=reality&sni=${REALITY_SERVER_NAME}&fp=chrome&pbk=${public_key}&sid=${short_id}&type=tcp&flow=xtls-rprx-vision#oracle-a1-reality"

          echo "XRAY_STATUS=$(systemctl is-active xray)"
          echo "XRAY_VERSION=$(/usr/local/bin/xray version | head -n 1)"
          ss -tlnp | grep ':443 ' || true
          systemctl --no-pager --full status cpu-limit.service memory-limit.service | sed -n '1,80p' || true
          echo "VLESS_LINK=$link"
          REMOTE

          sed -i "s|__PUBLIC_IP__|$public_ip|g" /tmp/install-xray.sh
          ssh -i /tmp/oracle_ssh_key \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=4 \
            "ubuntu@${public_ip}" \
            'sudo bash -s' < /tmp/install-xray.sh

      - name: Verify public TCP 443 from runner
        run: |
          set -Eeuo pipefail
          public_ip='${{ inputs.public_ip }}'
          for _ in $(seq 1 12); do
            if timeout 5 bash -c ":</dev/tcp/${public_ip}/443"; then
              echo "PUBLIC_443=reachable"
              exit 0
            fi
            sleep 5
          done
          echo "PUBLIC_443=unreachable"
          exit 1

  deploy_wofo_dr:
    if: inputs.mode == 'wofo-dr'
    runs-on: ubuntu-latest
    steps:
      - name: Prepare signed artifacts and root-only configuration
        env:
          RELEASE_URL: ${{ secrets.WOFO_RELEASE_URL }}
          SEED_URL: ${{ secrets.WOFO_SEED_URL }}
          ADMIN_TOKEN: ${{ secrets.WOFO_ADMIN_TOKEN }}
          BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.WOFO_BOOTSTRAP_ADMIN_PASSWORD }}
          TUNNEL_CREDENTIALS_B64: ${{ secrets.WOFO_ORACLE_TUNNEL_CREDENTIALS_B64 }}
          AWS_DR_PUBLIC_KEY: ${{ secrets.WOFO_AWS_DR_PUBLIC_KEY }}
          ORACLE_SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          umask 077
          test -n "$RELEASE_URL"
          test -n "$SEED_URL"
          test -n "$ADMIN_TOKEN"
          test -n "$BOOTSTRAP_ADMIN_PASSWORD"
          test -n "$TUNNEL_CREDENTIALS_B64"
          test -n "$AWS_DR_PUBLIC_KEY"
          test -n "$ORACLE_SSH_PRIVATE_KEY"

          curl -fsSL "$RELEASE_URL" -o /tmp/wofo-release.tar.gz
          echo 'bb8eab1cc0e16aba643338d704902a44da2d951dd1b8fa0b1b019874c53ab85e  /tmp/wofo-release.tar.gz' | sha256sum -c -
          curl -fsSL "$SEED_URL" -o /tmp/wofo-seed.tar.gz
          echo '2122a00d0671b0768f71db060fb3ed75562b21039de4a2f530e8550893716e49  /tmp/wofo-seed.tar.gz' | sha256sum -c -
          printf '%s' "$TUNNEL_CREDENTIALS_B64" | base64 -d > /tmp/cloudflared-credentials.json
          printf '%s\n' "$AWS_DR_PUBLIC_KEY" > /tmp/aws-dr.pub
          printf '%s\n' "$ORACLE_SSH_PRIVATE_KEY" > /tmp/oracle-ssh-key
          chmod 600 /tmp/oracle-ssh-key

          cat > /tmp/wofo.env <<EOF
          WOFO_ORIGIN=oracle
          WOFO_HOST=127.0.0.1
          WOFO_PORT=8787
          WOFO_DB_PATH=/srv/wofo/data/wofo.sqlite
          WOFO_FILES_DIR=/srv/wofo/data/files
          WOFO_ROLE_FILE=/srv/wofo/state/role
          WOFO_REPLICA_STATE_FILE=/srv/wofo/state/replica.json
          WOFO_RELEASE_FILE=/opt/wofo/current/RELEASE
          WOFO_SERVICE_USER=wofo
          WOFO_MIN_FREE_GIB=8
          INITIAL_ROLE=standby
          ENVIRONMENT=production
          PASSWORD_ITERATIONS=100000
          CODE_TTL_SECONDS=600
          RATE_LIMIT_WINDOW_SECONDS=60
          RATE_LIMIT_MAX_REQUESTS=5
          RAW_IP_RETENTION_DAYS=7
          ISSUE_ATTACHMENT_MAX_BYTES=10485760
          ISSUE_EVENT_RETENTION_DAYS=30
          ISSUE_RATE_LIMIT_WINDOW_SECONDS=60
          ISSUE_RATE_LIMIT_MAX_INSTALL_EVENTS=20
          ISSUE_RATE_LIMIT_MAX_USER_EVENTS=60
          APP_VERSION=1.1.8
          APP_BUILD_NUMBER=17
          APP_CHANNEL=internal
          APP_DOWNLOAD_URL=https://download-stage.airoute.xyz/download
          APP_RELEASE_NOTES=production-standby-1.1.8
          APP_FORCE_UPDATE=false
          APP_MIN_SUPPORTED_BUILD_NUMBER=1
          APP_APK_SIZE="250.6 MB"
          APP_PUBLISHED_AT=2026-07-10T07:46:41.287Z
          APK_OBJECT_KEY=releases/wofo_app_pro-v1.1.8-build17-internal.apk
          DOWNLOAD_MANIFEST_KEY=downloads/releases.json
          RELEASE_PUBLIC_BASE_URL=https://download-stage.airoute.xyz
          ADMIN_CORS_ORIGINS=https://wofo-oracle-stage.airoute.xyz
          ADMIN_LOGIN_MAX_ATTEMPTS=5
          ADMIN_LOGIN_WINDOW_SECONDS=900
          ADMIN_SESSION_TTL_SECONDS=3600
          BOOTSTRAP_ADMIN_EMAIL=admin
          WOFO_WECHAT_ENABLED=false
          PASSWORD_PEPPER=
          IP_HASH_SECRET=
          WECHAT_APP_ID=
          WECHAT_APP_SECRET=
          INTERNAL_OPS_TOKEN=
          ADMIN_TOKEN=$ADMIN_TOKEN
          BOOTSTRAP_ADMIN_PASSWORD=$BOOTSTRAP_ADMIN_PASSWORD
          WECHAT_TEST_OPENID=
          WECHAT_TEST_UNIONID=
          WECHAT_TEST_NICKNAME=
          DR_SNAPSHOT_ROOT=/srv/wofo/snapshots
          DR_REPLICA_ROOT=/srv/wofo/replica
          DR_SNAPSHOT_GROUP=wofo-dr
          DR_SHORT_RETENTION_MINUTES=1440
          DR_DAILY_RETENTION_DAYS=30
          DR_REMOTE_HOST=35.73.41.205
          DR_REMOTE_PORT=22
          DR_REMOTE_USER=ec2-user
          DR_REMOTE_SSH_KEY=/var/lib/wofo/.ssh/wofo-dr-ed25519
          DR_REMOTE_KNOWN_HOSTS=/var/lib/wofo/.ssh/known_hosts
          DR_REMOTE_SNAPSHOT_ROOT=/srv/wofo/replica
          DR_OPERATOR_USER=ubuntu
          CLOUDFLARE_TUNNEL_ID=439094de-03e3-4a49-b66c-98d4a1a6b7c3
          PUBLIC_HOSTNAME=wofo-oracle-stage.airoute.xyz
          RELEASE_HOSTNAME=download-stage.airoute.xyz
          EOF

      - name: Install Oracle standby without touching Xray
        env:
          PUBLIC_IP: ${{ inputs.public_ip }}
        run: |
          set -Eeuo pipefail
          ssh_opts=(
            -i /tmp/oracle-ssh-key
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=no
            -o UserKnownHostsFile=/dev/null
            -o ConnectTimeout=20
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=4
          )
          scp "${ssh_opts[@]}" \
            /tmp/wofo-release.tar.gz /tmp/wofo-seed.tar.gz /tmp/wofo.env \
            /tmp/cloudflared-credentials.json /tmp/aws-dr.pub \
            "ubuntu@${PUBLIC_IP}:/tmp/"

          ssh "${ssh_opts[@]}" "ubuntu@${PUBLIC_IP}" 'sudo bash -s' <<'REMOTE'
          set -Eeuo pipefail
          listener_before=$(ss -H -ltnp 'sport = :443' 2>/dev/null || true)
          systemctl is-active --quiet xray
          echo "XRAY_BEFORE=active"
          printf '%s\n' "$listener_before"
          df -h /

          release_stage=/var/tmp/wofo-release-f9437623
          seed_stage=/var/tmp/wofo-production-seed-20260711-092716
          rm -rf -- "$release_stage" "$seed_stage"
          install -d -m 0755 "$release_stage" "$seed_stage"
          tar -xzf /tmp/wofo-release.tar.gz -C "$release_stage"
          tar -xzf /tmp/wofo-seed.tar.gz -C "$seed_stage"
          bash "$release_stage/ops/aws-oracle-dr/bootstrap-host.sh" --release-site --apply

          install -d -o root -g root -m 0755 /etc/wofo
          install -o root -g root -m 0600 /tmp/cloudflared-credentials.json /etc/wofo/cloudflared-credentials.json
          bash "$release_stage/ops/aws-oracle-dr/install.sh" --env /tmp/wofo.env
          bash "$release_stage/ops/aws-oracle-dr/deploy-release.sh" \
            --artifact /tmp/wofo-release.tar.gz \
            --release f9437623-oracle-standby \
            --sha256 bb8eab1cc0e16aba643338d704902a44da2d951dd1b8fa0b1b019874c53ab85e

          test ! -e /srv/wofo/data/wofo.sqlite
          set -a
          source /etc/wofo/wofo.env
          set +a
          /usr/local/bin/node /opt/wofo/current/server/wofo-runtime/src/cli.mjs import-sql \
            --db /srv/wofo/data/wofo.sqlite --sql "$seed_stage/d1-production.sql"
          /usr/local/bin/node /opt/wofo/current/server/wofo-runtime/src/cli.mjs import-kv \
            --db /srv/wofo/data/wofo.sqlite --input "$seed_stage/kv-wofo-production.json"
          /usr/local/bin/node /opt/wofo/current/server/wofo-runtime/src/cli.mjs import-files \
            --db /srv/wofo/data/wofo.sqlite \
            --manifest "$seed_stage/r2-aws-import-manifest.json" \
            --source "$seed_stage/r2-dynamic"
          chown -R wofo:wofo /srv/wofo/data

          install -d -o root -g root -m 0755 /srv/wofo/releases-public/objects/downloads
          install -o root -g root -m 0644 \
            "$seed_stage/r2-dynamic/downloads/releases.json" \
            /srv/wofo/releases-public/objects/downloads/releases.json
          rm -f /etc/nginx/sites-enabled/default
          nginx -t

          install -d -o wofo -g wofo -m 0700 /var/lib/wofo/.ssh
          if [ ! -f /var/lib/wofo/.ssh/wofo-dr-ed25519 ]; then
            sudo -u wofo ssh-keygen -q -t ed25519 -N '' -C wofo-oracle-dr \
              -f /var/lib/wofo/.ssh/wofo-dr-ed25519
          fi
          ssh-keyscan -H 35.73.41.205 > /var/lib/wofo/.ssh/known_hosts
          chown wofo:wofo /var/lib/wofo/.ssh/known_hosts
          chmod 0600 /var/lib/wofo/.ssh/known_hosts
          install -d -o ubuntu -g ubuntu -m 0700 /home/ubuntu/.ssh
          touch /home/ubuntu/.ssh/authorized_keys
          grep -qxF "$(cat /tmp/aws-dr.pub)" /home/ubuntu/.ssh/authorized_keys \
            || cat /tmp/aws-dr.pub >> /home/ubuntu/.ssh/authorized_keys
          chown ubuntu:ubuntu /home/ubuntu/.ssh/authorized_keys
          chmod 0600 /home/ubuntu/.ssh/authorized_keys

          printf 'standby\n' > /srv/wofo/state/role
          chown root:wofo /srv/wofo/state/role
          chmod 0640 /srv/wofo/state/role
          /usr/local/bin/node /opt/wofo/current/server/wofo-runtime/src/cli.mjs readiness \
            --db /srv/wofo/data/wofo.sqlite \
            --expected-version 1.1.8 --expected-build 17 \
            --expected-hash 1D183153FDAF8A307A11E96C259EA92381EFFD7710BFF130B0801D3666B56A9C

          systemctl restart wofo-runtime.service
          systemctl restart nginx.service
          systemctl restart wofo-cloudflared.service
          for _ in $(seq 1 10); do
            curl -fsS --max-time 5 http://127.0.0.1:8787/health && break
            sleep 1
          done
          curl -fsS --max-time 5 http://127.0.0.1:8788/objects/downloads/releases.json >/dev/null

          listener_after=$(ss -H -ltnp 'sport = :443' 2>/dev/null || true)
          test "$listener_before" = "$listener_after"
          systemctl is-active --quiet xray
          systemctl is-active --quiet wofo-runtime
          systemctl is-active --quiet nginx
          systemctl is-active --quiet wofo-cloudflared
          echo "XRAY_AFTER=active"
          printf 'ORACLE_DR_PUBLIC_KEY='
          cat /var/lib/wofo/.ssh/wofo-dr-ed25519.pub
          df -h /
          REMOTE

  deploy_wofo_assets:
    if: inputs.mode == 'wofo-assets'
    runs-on: ubuntu-latest
    steps:
      - name: Prepare scoped R2 and Oracle credentials
        env:
          R2_READ_TOKEN: ${{ secrets.WOFO_R2_READ_TOKEN }}
          ORACLE_SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          umask 077
          test -n "$R2_READ_TOKEN"
          test -n "$ORACLE_SSH_PRIVATE_KEY"
          printf '%s' "$R2_READ_TOKEN" > /tmp/wofo-r2-read-token
          printf '%s\n' "$ORACLE_SSH_PRIVATE_KEY" > /tmp/oracle-ssh-key
          chmod 600 /tmp/oracle-ssh-key

      - name: Stream release site from R2 to Oracle
        env:
          PUBLIC_IP: ${{ inputs.public_ip }}
        run: |
          set -Eeuo pipefail
          ssh_opts=(
            -i /tmp/oracle-ssh-key
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=no
            -o UserKnownHostsFile=/dev/null
            -o ConnectTimeout=20
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=20
          )
          scp "${ssh_opts[@]}" /tmp/wofo-r2-read-token "ubuntu@${PUBLIC_IP}:/tmp/"
          ssh "${ssh_opts[@]}" "ubuntu@${PUBLIC_IP}" 'sudo bash -s' <<'REMOTE'
          set -Eeuo pipefail
          account=2db9ce499dd34cf76b6bfaad3bdf6b9a
          bucket=wofo-files-prod
          api="https://api.cloudflare.com/client/v4/accounts/$account/r2/buckets/$bucket/objects"
          token=$(cat /tmp/wofo-r2-read-token)
          root=/srv/wofo/releases-public/objects
          listener_before=$(ss -H -ltnp 'sport = :443' 2>/dev/null || true)
          systemctl is-active --quiet xray

          for prefix in downloads/ releases/; do
            list=$(mktemp)
            curl -fsS -H "Authorization: Bearer $token" \
              "$api?prefix=${prefix//\//%2F}&per_page=1000" -o "$list"
            jq -e '.success == true' "$list" >/dev/null
            jq -c '.result[]' "$list" | while IFS= read -r item; do
              key=$(jq -r '.key' <<<"$item")
              size=$(jq -r '.size' <<<"$item")
              etag=$(jq -r '.etag' <<<"$item" | tr -d '"')
              target="$root/$key"
              install -d -o root -g root -m 0755 "$(dirname "$target")"
              valid=0
              if [ -f "$target" ] && [ "$(stat -c %s "$target")" = "$size" ]; then
                [ "$(md5sum "$target" | awk '{print $1}')" = "$etag" ] && valid=1
              fi
              if [ "$valid" -ne 1 ]; then
                temporary="$target.part"
                rm -f -- "$temporary"
                curl -fsSL --retry 4 --retry-all-errors \
                  -H "Authorization: Bearer $token" "$api/$key" -o "$temporary"
                [ "$(stat -c %s "$temporary")" = "$size" ]
                [ "$(md5sum "$temporary" | awk '{print $1}')" = "$etag" ]
                chmod 0644 "$temporary"
                mv -f "$temporary" "$target"
              fi
              echo "SYNCED $key $size"
            done
            rm -f "$list"
          done

          rm -f /tmp/wofo-r2-read-token
          nginx -t
          systemctl restart nginx.service
          curl -fsS --max-time 10 http://127.0.0.1:8788/ >/dev/null
          curl -fsS --max-time 10 http://127.0.0.1:8788/download >/dev/null
          echo '1D183153FDAF8A307A11E96C259EA92381EFFD7710BFF130B0801D3666B56A9C  /srv/wofo/releases-public/objects/releases/wofo_app_pro-v1.1.8-build17-internal.apk' | sha256sum -c -
          echo '91A941E7552DCDE729E7C477E95E37900E0EE7F9BB0834A710F559956D2763C5  /srv/wofo/releases-public/objects/releases/wofo_app_pro-v1.1.8-build17-x86_64-internal.apk' | sha256sum -c -
          listener_after=$(ss -H -ltnp 'sport = :443' 2>/dev/null || true)
          test "$listener_before" = "$listener_after"
          systemctl is-active --quiet xray
          find "$root/downloads" "$root/releases" -type f -printf '%s\n' \
            | awk '{count += 1; bytes += $1} END {printf "RELEASE_OBJECTS=%d RELEASE_BYTES=%.0f\n", count, bytes}'
          df -h /
          REMOTE
